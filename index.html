<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllSee - Secure AllStarLink Node Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --panel-bg: rgba(17, 24, 39, 0.85);
            --border-line: rgba(255, 255, 255, 0.08);
            --cyan-accent: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.25);
            --green-accent: #10b981;
            --green-glow: rgba(16, 185, 129, 0.25);
            --red-accent: #f43f5e;
            --red-glow: rgba(244, 63, 94, 0.25);
            --amber-accent: #f59e0b;
            --blue-accent: #3b82f6;
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .hub-box {
            width: 100%;
            max-width: 460px;
            background: var(--panel-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-line);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        .hub-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan-accent), transparent);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .branding-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 16px var(--cyan-glow);
        }

        .branding-text h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .branding-text h1 span {
            color: var(--cyan-accent);
        }

        .branding-text p {
            font-size: 11px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-logout {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--red-accent);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-logout:hover {
            background: var(--red-accent);
            color: #fff;
        }

        .field-wrap {
            margin-bottom: 16px;
        }

        .field-wrap label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .field-input {
            width: 100%;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid var(--border-line);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.25s;
        }

        .field-input:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 14px var(--cyan-glow);
            background: rgba(3, 7, 18, 0.95);
        }

        .grid-two-cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-action {
            padding: 13px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .btn-login {
            background: linear-gradient(135deg, #0891b2, #0284c7);
            color: #fff;
            box-shadow: 0 4px 14px var(--cyan-glow);
        }

        .btn-connect {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .btn-connect:hover {
            background: var(--green-accent);
            color: #022c22;
            box-shadow: 0 0 16px var(--green-glow);
        }

        .btn-disconnect {
            background: rgba(244, 63, 94, 0.15);
            border-color: rgba(244, 63, 94, 0.4);
            color: #fb7185;
        }
        .btn-disconnect:hover {
            background: var(--red-accent);
            color: #4c0519;
            box-shadow: 0 0 16px var(--red-glow);
        }

        .btn-full {
            grid-column: span 2;
        }

        .btn-amber {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.3);
            color: #fbbf24;
        }
        .btn-amber:hover {
            background: var(--amber-accent);
            color: #451a03;
        }

        /* কানেক্টেড নোডস প্যানেল */
        .live-monitor-box {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid var(--border-line);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .live-monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .live-monitor-header span.title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        .badge-count {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(6, 182, 212, 0.15);
            color: var(--cyan-accent);
            font-weight: 700;
        }

        .nodes-content {
            font-family: 'Fira Code', monospace;
            font-size: 12.5px;
            color: #a5f3fc;
            min-height: 24px;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        /* টার্মিনাল কনসোল */
        .terminal-box {
            background: #020617;
            border: 1px solid var(--border-line);
            border-radius: 14px;
            overflow: hidden;
        }

        .terminal-head {
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            color: var(--text-sub);
        }

        .terminal-output {
            padding: 12px;
            min-height: 85px;
            max-height: 110px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            line-height: 1.5;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .error-msg {
            color: #fb7185;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="hub-box">
    <!-- হেডার -->
    <div class="header">
        <div class="branding">
            <div class="branding-icon">📡</div>
            <div class="branding-text">
                <h1>All<span>See</span></h1>
                <p>Node Command Center</p>
            </div>
        </div>
        <button class="btn-logout" id="logoutBtn" style="display: none;" onclick="processLogout()">লগআউট</button>
    </div>

    <!-- ১. লগইন ভিউ -->
    <div class="view-section" id="loginView">
        <div class="field-wrap">
            <label for="loginUser">ইউজারনেম</label>
            <input type="text" class="field-input" id="loginUser" placeholder="admin" autocomplete="off">
        </div>
        <div class="field-wrap">
            <label for="loginPass">পাসওয়ার্ড</label>
            <input type="password" class="field-input" id="loginPass" placeholder="••••••••">
        </div>
        <button class="btn-action btn-login" onclick="processLogin()">লগইন করুন</button>
        <div class="error-msg" id="loginError"></div>
    </div>

    <!-- ২. ড্যাশবোর্ড ভিউ -->
    <div class="view-section" id="dashboardView">
        <div class="grid-two-cols field-wrap">
            <div>
                <label for="localNode">Local Node</label>
                <input type="number" class="field-input" id="localNode" value="50000">
            </div>
            <div>
                <label for="targetNode">Target Node</label>
                <input type="number" class="field-input" id="targetNode" placeholder="e.g. 1999">
            </div>
        </div>

        <div class="grid-two-cols field-wrap">
            <button class="btn-action btn-connect" onclick="sendCommand('connect')">Connect (*3)</button>
            <button class="btn-action btn-disconnect" onclick="sendCommand('disconnect')">Disconnect (*1)</button>
            <button class="btn-action btn-amber btn-full" onclick="sendCommand('disconnect_all')">Disconnect All (*76)</button>
        </div>

        <!-- লাইভ কানেক্টেড নোড প্যানেল -->
        <div class="live-monitor-box">
            <div class="live-monitor-header">
                <span class="title">Connected Nodes</span>
                <span class="badge-count" id="activeCount">Checking...</span>
            </div>
            <div class="nodes-content" id="nodesDisplay">নোডের স্ট্যাটাস যাচাই করা হচ্ছে...</div>
        </div>

        <!-- CLI রেসপন্স টার্মিনাল -->
        <div class="terminal-box">
            <div class="terminal-head">
                <span>cli@allstarlink:~</span>
                <span id="loaderNotice" style="display:none; color: var(--cyan-accent);">Processing...</span>
            </div>
            <div class="terminal-output" id="outputWindow">System Ready.</div>
        </div>
    </div>
</div>

<script>
// পেজ লোড হলে সেশন চেক করা
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const res = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'check_session' })
        });
        const data = await res.json();
        
        if (data.authenticated) {
            showDashboard();
        } else {
            showLogin();
        }
    } catch (e) {
        showLogin();
    }
});

function showLogin() {
    document.getElementById('loginView').classList.add('active');
    document.getElementById('dashboardView').classList.remove('active');
    document.getElementById('logoutBtn').style.display = 'none';
}

function showDashboard() {
    document.getElementById('loginView').classList.remove('active');
    document.getElementById('dashboardView').classList.add('active');
    document.getElementById('logoutBtn').style.display = 'block';
    refreshNodes();
}

async function processLogin() {
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value.trim();
    const errorElem = document.getElementById('loginError');

    errorElem.innerText = '';

    if (!username || !password) {
        errorElem.innerText = 'ইউজারনেম এবং পাসওয়ার্ড পূরণ করুন!';
        return;
    }

    try {
        const res = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'login', username, password })
        });
        const data = await res.json();

        if (data.status === 'success') {
            showDashboard();
        } else {
            errorElem.innerText = data.message;
        }
    } catch (err) {
        errorElem.innerText = 'সার্ভারে সংযোগ করা সম্ভব হয়নি!';
    }
}

async function processLogout() {
    await fetch('api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' })
    });
    showLogin();
}

// কমান্ড পাঠানো
async function sendCommand(action) {
    const localNode = document.getElementById('localNode').value.trim();
    const targetNode = document.getElementById('targetNode').value.trim();
    const outputElem = document.getElementById('outputWindow');
    const loader = document.getElementById('loaderNotice');

    if (!localNode) {
        alert('লোকাল নোড নম্বর দিন!');
        return;
    }

    if ((action === 'connect' || action === 'disconnect') && !targetNode) {
        alert('টার্গেট নোড নম্বর দিন!');
        return;
    }

    loader.style.display = 'inline';
    outputElem.innerText = '> Command sending...';

    try {
        const res = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, localNode, targetNode })
        });

        if (res.status === 401) {
            alert('লগইন মেয়াদ শেষ! পুনরায় লগইন করুন।');
            showLogin();
            return;
        }

        const data = await res.json();
        loader.style.display = 'none';

        if (data.status === 'success') {
            outputElem.innerText = data.output ? data.output : '> Command executed successfully.';
            // কমান্ড চালানোর ১ সেকেন্ড পর লাইভ নোড লিস্ট আপডেট হবে
            setTimeout(refreshNodes, 1000);
        } else {
            outputElem.innerText = '! Error: ' + data.message;
        }
    } catch (err) {
        loader.style.display = 'none';
        outputElem.innerText = '! সার্ভারের সাথে যোগাযোগ বিচ্ছিন্ন হয়েছে।';
    }
}

// লাইভ কানেক্টেড নোড রিফ্রেশার
async function refreshNodes() {
    const localNode = document.getElementById('localNode').value.trim();
    if (!localNode) return;

    try {
        const res = await fetch('api.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'status', localNode })
        });
        const data = await res.json();
        
        const nodesDisplay = document.getElementById('nodesDisplay');
        const activeCount = document.getElementById('activeCount');

        if (data.status === 'success') {
            const raw = (data.output || '').trim();
            if (raw.length > 0) {
                nodesDisplay.innerText = raw;
                const lines = raw.split('\n').filter(l => l.trim().length > 0);
                activeCount.innerText = `${lines.length} Linked`;
            } else {
                nodesDisplay.innerText = "কোনো নোড যুক্ত নেই (No nodes connected)";
                activeCount.innerText = "0 Linked";
            }
        }
    } catch (e) {
        console.error("Auto sync failed:", e);
    }
}

// প্রতি ৫ সেকেন্ড পর পর ব্যাকগ্রাউন্ডে স্বয়ংক্রিয় রিফ্রেশ
setInterval(() => {
    const dash = document.getElementById('dashboardView');
    if (dash && dash.classList.contains('active')) {
        refreshNodes();
    }
}, 5000);
</script>

</body>
</html>
